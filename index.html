function switchTab(tabId) {
  // ሁሉንም የይዘት ገጾች ደብቅ
  var contents = document.querySelectorAll('.tab-content');
  contents.forEach(function(content) {
    content.style.display = 'none';
  });
  
  // ሁሉንም የሜኑ ሊንኮች ላይ "active" የሚለውን ክፍል አጥፋ
  var menuItems = document.querySelectorAll('.menu-item');
  menuItems.forEach(function(item) {
    item.classList.remove('active');
  });
  
  // የተመረጠውን ገጽ ብቻ አሳይ
  document.getElementById('tab-' + tabId).style.display = 'block';
  
  // ለተመረጠው ሊንክ የሰማያዊ ከለር ምልክት (active) ስጥ
  if (tabId === 'reception') {
    document.getElementById('menu-reception').classList.add('active');
  } else if (tabId === 'cashier') {
    document.getElementById('menu-cashier').classList.add('active');
  } else if (tabId === 'dashboard') {
    document.getElementById('menu-dashboard').classList.add('active');
  }
}

  var id = document.getElementById("patientId").value;
  var display = document.getElementById("resultDisplay");
  var text = document.getElementById("resultText");
  
  if(id.trim() === "") {
    alert("Please enter a patient ID first!");
    return;
  }
  
  display.style.display = "block";
  if(id === "LAB-101") {
    text.innerHTML = "🔬 Result: Normal - All tests completed successfully.";

}

<script>
function registerPatient(e) {
  e.preventDefault();
  alert("ታካሚው በተሳካ ሁኔታ ተመዝግቧል! መለያ ቁጥር: LAB-101");
}

function checkResult() {
  var id = document.getElementById("patientId").value;
  var display = document.getElementById("resultDisplay");
  var text = document.getElementById("resultText");
  
  if(id.trim() === "") {
    alert("እባክዎ መጀመሪያ የታካሚ መለያ ቁጥር ያስገቡ!");
    return;
  }
  
  display.style.display = "block";
  if(id === "LAB-101") {
    text.innerHTML = "🔬 ውጤት: ኖርማል (Normal) - ሁሉም ምርመራዎች በደህና ተጠናቀዋል።";
    text.style.color = "green";
  } else {
    text.innerHTML = "❌ ማሳሰቢያ: በዚህ መለያ ቁጥር የተመዘገበ ታካሚ አልተገኘም።";
    text.style.color = "red";
  }
}
</script>

</body>
</html>
